name: Mambu
description: >-
  Mambu is a SaaS cloud banking platform — a composable, API-first core banking
  engine that financial institutions use to build and run lending, deposit,
  payment, and Islamic banking products. Banks, neobanks, fintechs, lenders, and
  non-financial brands (telcos, retailers) use Mambu to modernize legacy cores
  and launch products faster, operating across 65+ countries and serving 230M+
  end users. Mambu exposes a REST API v2 (with separate Payments, Streaming, and
  Audit Trail APIs), customizable webhooks, and a resumable event-streaming
  surface, secured with HTTPS Basic auth or apikey headers and supporting
  Idempotency-Key for safe writes.
